name: nightly

# 每夜版（预发布）：固定 tag `nightly`，永远只有一个。
#   - 每天北京时间 0 点（UTC 16:00）检查一次。
#   - HEAD 的 commit SHA 和上次构建相同（期间没推送）→ 跳过。
#   - 有新提交 → 就地更新：覆盖 DLL 包、重写说明，不删不建。
#   - 若最新正式版比 nightly Release 晚发布（期间发了正式版）
#     → 删掉重建，让每夜版重新排到 Release 列表最上面。
#   - 说明里逐插件标注相对最新正式版的更新状态：哪些插件更新了
#     （提交列表）、哪些没更新；版本号 = 各插件最后一次提交的日期，
#     与 DLL 文件属性、「关于此插件」弹窗一致。
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 完整历史 + tag，用于生成各插件的更新状态与提交列表

      # 说明里的「更新时间」「构建于」按北京时间展示
      - name: Set timezone to China Standard Time
        shell: powershell
        run: Set-TimeZone -Id "China Standard Time"

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Package
        shell: bash
        run: bash .github/scripts/package.sh

      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          repo="$GITHUB_REPOSITORY"
          sha="${GITHUB_SHA:0:8}"
          # 北京时间 = UTC+8。TZ=Asia/Shanghai 在 runner 的 Git Bash 里
          # 会静默失效（缺 zoneinfo），改用 UTC 加 8 小时换算。
          today=$(date -u -d "+8 hours" +%Y.%m.%d)

          # ---- 收集信息（releases/latest 不含预发布，返回的就是最新正式版）----
          stable=$(gh api "repos/$repo/releases/latest" 2>/dev/null || true)
          stable_tag=$(echo "$stable" | jq -r '.tag_name // empty')
          stable_pub=$(echo "$stable" | jq -r '.published_at // empty')

          have=0
          created=""
          if gh release view nightly -R "$repo" >/dev/null 2>&1; then
            have=1
            created=$(gh release view nightly -R "$repo" --json createdAt --jq .createdAt)
          fi

          # ---- 各插件相对最新正式版的更新状态 ----
          if [ -n "$stable_tag" ] && git rev-parse -q --verify "refs/tags/$stable_tag" >/dev/null; then
            base="$stable_tag"
            baseline="相对 $stable_tag 的变更（[对比](https://github.com/$repo/compare/$stable_tag...nightly)）："
          else
            base=ROOT
            baseline="相对仓库起始的全部变更："
          fi

          # ---- 说明内容 ----
          {
            echo "每夜版（预发布）：构建于 $today"
            echo ""
            echo "commit: $sha"
            echo ""
            echo "$baseline"
            echo ""
            bash .github/scripts/plugin-notes.sh "$base"
          } > notes.md

          # ---- 正式版更新过 → 删掉重建，保持每夜版在最上面 ----
          if [ "$have" = 1 ] && [ -n "$stable_pub" ]; then
            if [ "$(date -d "$stable_pub" +%s)" -ge "$(date -d "$created" +%s)" ]; then
              echo "stable released after nightly -> recreate"
              gh release delete nightly -R "$repo" --yes --cleanup-tag
              have=0
            fi
          fi

          # ---- 不存在 → 新建 ----
          if [ "$have" = 0 ]; then
            gh release create nightly dist/*.zip \
              -R "$repo" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Nightly Build" \
              --notes-file notes.md
            exit 0
          fi

          # ---- 没推送 → 跳过（比对说明里记录的 SHA）----
          body=$(gh release view nightly -R "$repo" --json body --jq .body)
          recorded=$(echo "$body" | sed -n 's/^commit: //p')
          if [ "$recorded" = "$sha" ]; then
            echo "no new commits since last nightly -> skip"
            exit 0
          fi

          # ---- 有新提交 → 就地更新 ----
          # tag 还停在旧提交，先移到 HEAD，Release 的源码快照和对比链接才正确
          git push -f origin "$GITHUB_SHA:refs/tags/nightly"
          gh release upload nightly dist/*.zip -R "$repo" --clobber

          # 压缩包以版本号命名：某插件版本变了文件名就变，删掉已不在本次构建的旧附件
          names=$(gh release view nightly -R "$repo" --json assets --jq '.assets[].name')
          for name in $names; do
            keep=0
            for f in dist/*.zip; do
              if [ "$(basename "$f")" = "$name" ]; then keep=1; fi
            done
            if [ "$keep" = 0 ]; then
              echo "prune stale asset: $name"
              gh release delete-asset nightly "$name" -R "$repo" --yes
            fi
          done

          gh release edit nightly -R "$repo" \
            --title "Nightly Build" \
            --notes-file notes.md
