name: auto-release

# 15 天没有推送就自动发布 Release（多插件版）：
#   - 触发条件：距最后一次推送 >= 15 天，且最后一次推送之后还没有发布过
#     （对比最近一次 Release 的 published_at 与最后一次提交时间，避免同一
#     静默期内重复发版）。
#   - 版本号 = 发布日期（tag = vYYYY.MM.DD）。插件版本号由 build.bat 自动
#     生成为「该插件最后一次提交的日期」（version.h，DLL 属性与「关于此
#     插件」弹窗一致），说明里逐插件列出：本次更新了哪些（版本、提交
#     列表）、哪些没更新（版本号即其上次更新日期）。
#   - 每天 UTC 03:00 检查一次；workflow_dispatch 供手动触发测试。
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maybe-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 完整历史，供 plugin-notes.sh 统计各插件的更新状态

      - name: Check 15-day quiet period
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          quiet=$(( (now - last) / 86400 ))
          echo "days since last push: $quiet"
          if [ "$quiet" -lt 15 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 还没有正式 Release 时 releases/latest 返回 404（响应体是错误 JSON），
          # 不能直接把它当时间戳；交给 jq 取字段，取不到就按「没发布过」处理。
          resp=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || true)
          pub=$(echo "$resp" | jq -r '.published_at // empty' 2>/dev/null || true)
          if [ -n "$pub" ]; then
            pcts=$(date -d "$pub" +%s)
            if [ "$pcts" -ge "$last" ]; then
              echo "already released after last push -> skip"
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      # 说明里的「更新时间」按北京时间展示
      - name: Set timezone to China Standard Time
        if: steps.decide.outputs.go == 'true'
        shell: powershell
        run: Set-TimeZone -Id "China Standard Time"

      - name: Build
        if: steps.decide.outputs.go == 'true'
        shell: cmd
        run: call build.bat

      - name: Create release
        if: steps.decide.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          repo="$GITHUB_REPOSITORY"
          ver=$(date +%Y.%m.%d)
          tag="v$ver"
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            echo "tag $tag already exists, skip"; exit 0
          fi

          # 上一个正式版的 tag 作为对比基线；没有正式版（或 tag 不在本地）时
          # 退回到首个提交
          resp=$(gh api "repos/$repo/releases/latest" 2>/dev/null || true)
          base=$(echo "$resp" | jq -r '.tag_name // empty' 2>/dev/null || true)
          if [ -z "$base" ] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            # ROOT 不是合法的 git 引用：`git log ROOT..HEAD` 会报 bad revision，
            # 被 `|| true` 吞掉后每个插件都被判成「未更新」，首次发布的正式版
            # 因此没有任何附件
            base=$(git rev-list --max-parents=0 HEAD)
          fi

          # 本次有更新的插件（按插件目录判断）；正式 Release 只附这些插件的压缩包
          plugins=$(for d in */; do
            p=${d%/}
            if [ -f "$p/$p.def" ]; then echo "$p"; fi
          done)
          updated=""
          for p in $plugins; do
            ts=$(git log -1 --format=%ct "$base..HEAD" -- "$p" || true)
            if [ -n "$ts" ]; then updated="$updated $p"; fi
          done

          {
            echo "自动发布：距上次推送已超过 15 天。发布日期：$ver"
            echo ""
            echo "全部代码：[\`v$ver\`](https://github.com/$repo/tree/$tag)"
            echo ""
            bash .github/scripts/plugin-notes.sh "$base" release
          } > notes.md

          # 静默期内没动过任何插件（只改了 CI/文档）→ 发布不带附件
          if [ -z "$updated" ]; then
            echo "no plugin updated since $base -> release without attachments"
            gh release create "$tag" -R "$repo" \
              --title "CLaunch Plugins v$ver" \
              --notes-file notes.md
            exit 0
          fi

          bash .github/scripts/package.sh $updated
          gh release create "$tag" dist/*.zip \
            -R "$repo" \
            --title "CLaunch Plugins v$ver" \
            --notes-file notes.md

          # gh 先建 Release 再传附件：上传失败时仍会留下一个只有源码的
          # Release，且不易察觉。这里逐个核对压缩包是否真的挂上了，失败就让任务红。
          names=$(gh release view "$tag" -R "$repo" --json assets --jq '.assets[].name')
          missing=0
          for f in dist/*.zip; do
            name=$(basename "$f")
            if ! printf '%s\n' "$names" | grep -qxF "$name"; then
              echo "[ERROR] missing asset: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
