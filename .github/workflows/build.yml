name: build

# 每次推送都编译全部插件（Win32 + x64）；产物作为 artifact 保留，供手动下载验证。
on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 完整历史：版本号 = 各插件最后一次提交的日期（build.bat 取）

      # git 取提交日期按 runner 本地时区换算，统一成北京时间
      - name: Set timezone to China Standard Time
        shell: powershell
        run: Set-TimeZone -Id "China Standard Time"

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CLaunch-Plugins-${{ github.sha }}
          path: |
            bin/Win32/*.dll
            bin/x64/*.dll
          if-no-files-found: error
